#docker compose caching fix
opcache.enable=1
short_open_tag=On
memory_limit=64M
upload_max_filesize=2G;
post_max_size= 2G;
output_buffering= 4096
auto_globals_jit=On

# xdebug
xdebug.mode=debug,coverage,develop,profile
xdebug.start_with_request=yes
xdebug.client_port=9002
xdebug.client_host=host.docker.internal
xdebug.discover_client_host=1
xdebug.log_level=10
xdebug.log=/app/etc/logs/xdebug.log